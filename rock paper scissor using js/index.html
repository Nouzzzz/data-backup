<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ROCK PAPER SCISSOR GAME</h1>
    </header>
        <div class="user">
    <h2>Select a option [Rock/Paper/Scissor]</h2>
</div>
    <div class="content">
    
  
        <div class="card" id="rock">
            
            <img src="rock.jpg" height="150px" width="150px" alt="">
            <h2>Rock</h2>
        </div>
        <div class="card" id="paper">
           
            <img src="paper.jpg" height="150px" width="150px"  alt="">
             <h2>Paper</h2>
        </div>
        <div class="card" id="scissor">
         
            <img src="scissors.jpg" height="150px" width="150px"  alt="">
               <h2>Scissor</h2>
        </div>
    
    </div>

    <div class="result" id="result">
        <h2>Result</h2>
    </div>

     <main id="main">

        </main>

    <script src="script.js"></script>
</body>
</html>
