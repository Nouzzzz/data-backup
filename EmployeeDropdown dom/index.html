<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <header>
        <h2>Employee management system</h2>
    </header>

    <div id="content">
        <input type="text" id="ename" placeholder="Name">
         <input type="text" id="uid" placeholder="Unique ID">
          <input type="text" id="department" placeholder="Department">
          <input type="text" id="salary" placeholder="Salary">
          <button id="addbtn">Add Employee</button>
    </div>

 <div id="gallery">
        <table id="table">
            <tr>
                <th>NAME</th>
                <th>UNIQUE ID</th>
                <th>DEPARTMENT</th>
                <th>SALARY</th>
            </tr>
        </table>
     </div>  

    <script src="script.js"></script>
</body>
</html>
