<!DOCTYPE html>

    <link rel="stylesheet" href="styles.css">

                    <button id="updateBtn" style="display:none;">

                    </button>

                </div>
            </div>

            <div class="asideb">
                <button id="editbtn">Edit</button>
                <button id="deletebtn">Delete</button>
            </div>

        </aside>

        <section>
            <div class="card">

            </div>



            <div class="card">

            </div>

            <div class="card">

            </div>

            <div class="card">
                <h3>Student 4</h3>
            </div>

            <div class="card">
                <h3>Student 5</h3>
            </div>

            <div class="card">
                <h3>Student 6</h3>
            </div>

            <div class="card">
                <h3>Student 7</h3>
            </div>

            <div class="card">
                <h3>Student 8</h3>
            </div>


        </section>
    </div>


    <footer>
        <h2>CONTACTS</h2>
    </footer>

    <script src="script.js"></script>
</body>

</html>
